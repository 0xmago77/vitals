[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vitals"
version = "1.0.0"
description = "Vitals: health-factor checkups for Venus Core Pool loans on BNB Smart Chain, sold as ERC-8183 jobs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "bnbagent==0.5.0",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
vitals = "vitals.cli:main"

[tool.setuptools.packages.find]
include = ["vitals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: reads BSC mainnet over public RPC (deselect with -m 'not live')",
    "fork: needs anvil forking BSC mainnet",
]
